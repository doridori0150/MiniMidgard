<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미니 미드가르 에셋 무대</title>
<!-- asset-kit 공방의 "게임 무대" 탭이 이 페이지를 iframe으로 엽니다(asset-kit.json stage.local = dist/asset-stage.html, vite build로 만듦).
     게임과 같은 도트 영웅 렌더러(src/render/pixel.ts)로 고른 영웅 한 명의 동작·스킬 모션을 재생하고, 공방의 프레임 촬영에 답합니다.
     플레이어 저장(localStorage)은 읽지도 쓰지도 않습니다. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b3a2e; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #note { position: absolute; left: 10px; bottom: 8px; font: 12px/1.4 system-ui, sans-serif; color: #e6efe0; background: #0009; padding: 3px 8px; border-radius: 6px; pointer-events: none; }
</style>
</head>
<body>
<canvas id="stage" aria-label="에셋 무대"></canvas><div id="note">에셋 무대 준비 중…</div>
<script type="module" src="/src/stage/asset-stage.ts"></script>
</body>
</html>
