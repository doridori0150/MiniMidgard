<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MiniMidgard · rig review</title>
<style>body{font:15px system-ui;color:#3d3028;background:#f5f2e7;max-width:1100px;margin:32px auto;padding:0 20px}h1{font-size:25px}label{display:inline-flex;gap:7px;align-items:center;margin:6px 14px 6px 0}select,button{font:inherit;padding:5px}canvas{width:100%;height:410px;display:block;background:#d2e3b9;border-radius:12px;margin:20px 0}small{color:#645b51}a{color:#345c85}#time{width:260px}</style>
<h1>MiniMidgard · 조립 리그 검수</h1><p>동일한 manifest와 PNG를 읽어 실시간 조립합니다. 왼쪽은 확대, 오른쪽은 80 CSS px 기준입니다.</p>
<div id="controls"></div><label><input id="play" type="checkbox" checked>재생</label><label>시간 <input id="time" type="range" min="0" max="1200" value="0"><output id="stamp">0 ms</output></label><label><input id="flip" type="checkbox">왼쪽 보기</label>
<canvas id="canvas"></canvas><p id="status">에셋 로딩…</p><small>활 동작은 자세 설계이며 활·화살·시위 원화는 납품 범위 밖입니다. 피격·사망 전용 표정도 아직 없습니다. <a href="PLAN.md">제작 계약·검증 기록</a> · <a href="preview_assembled.png">정적 조립 비교</a></small>
<script type="module">
import {loadAssets,drawCharacter} from './renderer.mjs';
try{
const m=await(await fetch('./manifest.json')).json(),images=await loadAssets(m),container=document.querySelector('#controls'),fields={};
for(const [key,label,values]of[['state','동작',Object.keys(m.animations)],['outfit','의상',Object.keys(m.outfits)],['hairColor','머리색',Object.keys(m.hairColors)],['weapon','무기',['none',...m.equipment.weapon]],['head_top','상단',['none',...m.equipment.head_top]],['head_mid','중단',['none',...m.equipment.head_mid]]]){const l=document.createElement('label');l.textContent=label;const s=document.createElement('select');for(const v of values)s.add(new Option(v,v));s.value=m.defaults[key]??(key==='state'?'idle':'none');l.append(s);container.append(l);fields[key]=s}
const c=document.querySelector('canvas'),ctx=c.getContext('2d'),range=document.querySelector('#time'),play=document.querySelector('#play'),stamp=document.querySelector('#stamp');let started=performance.now();
fields.state.onchange=()=>{started=performance.now();range.max=m.animations[fields.state.value].duration;range.value=0};range.oninput=()=>{play.checked=false};play.onchange=()=>{started=performance.now()-Number(range.value)};
function tick(now){const width=c.clientWidth,dpr=devicePixelRatio||1;if(c.width!==Math.round(width*dpr)||c.height!==Math.round(410*dpr)){c.width=Math.round(width*dpr);c.height=Math.round(410*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,410);const state=fields.state.value,a=m.animations[state];let t=Number(range.value);if(play.checked){t=(now-started)% (a.duration+(a.loop?0:650));t=Math.min(t,a.duration);range.value=t}stamp.value=Math.round(t)+' ms';const look={};for(const[k,s]of Object.entries(fields))if(k!=='state')look[k]=s.value==='none'?null:s.value;const facing=document.querySelector('#flip').checked?-1:1;drawCharacter(ctx,m,images,{x:width*.3,y:325,height:236,facing,state,time:t,look});drawCharacter(ctx,m,images,{x:width*.74,y:325,height:80,facing,state,time:t,look});ctx.fillStyle='#594839';ctx.font='14px system-ui';ctx.fillText('확대 236 px',width*.3-40,373);ctx.fillText('실제 크기 80 px',width*.74-45,373);requestAnimationFrame(tick)}
document.querySelector('#status').textContent='16개 투명 PNG 로딩 완료 · 손잡이와 장식은 부모 관절을 따라갑니다.';requestAnimationFrame(tick);
}catch(e){document.querySelector('#status').textContent='로딩 실패: '+e.message+' · HTTP 서버에서 열어 주세요.';throw e}
</script></html>
