<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>노비스 · 프레임 검토</title>
<style>body{margin:0;background:#19232d;color:#f6ecd9;font:16px/1.5 system-ui,sans-serif}main{max-width:1100px;margin:24px auto;padding:0 24px}h1{font-size:28px;margin:0}p{color:#c4c7c8}button,select{background:#364654;color:#fff;border:1px solid #73838d;border-radius:6px;padding:8px 13px;cursor:pointer}button[aria-pressed=true]{background:#8b6840}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.stage{display:flex;gap:24px;align-items:center;background:#25313e;padding:16px;border-radius:12px}.stage img{image-rendering:pixelated;width:512px;height:480px;max-width:65%;object-fit:contain}.stage img.one{width:128px;height:120px;margin:180px 192px;max-width:none}.info{min-width:220px}input{width:100%}.comparison{width:100%;image-rendering:pixelated}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#25313e;border-radius:10px;padding:12px}.card img{width:100%;image-rendering:pixelated}a{color:#f2ca7b}small{color:#acb8c2}summary{cursor:pointer}</style>
<main><h1>노비스 · 첫 모험</h1><p>리넨 셔츠와 올리브 조끼의 여성 여행자 · 단검 찌르기 · 2등신 / 대기 48px</p><div class="actions" id="actions"></div><div class="stage"><img id="sprite" alt="노비스 애니메이션"><div class="info"><h2 id="title"></h2><p id="frame"></p><button id="play">일시정지</button> <button id="next">다음 장</button><p><label>재생 속도 <select id="speed"><option value="1">1× 실제 속도</option><option value=".5">0.5× 느리게</option></select></label></p><input id="scrub" aria-label="프레임" type="range" min="0" value="0"><p id="time"></p><small>공격: 520ms<br>타격: 2번 장 · 220–280ms<br>미리보기는 반복 재생합니다.</small></div></div>
<h2>같은 크기로 비교</h2><p>왼쪽부터 ① 쿠키 r12 · ② 기사 r15 · ③ 노비스</p><img class="comparison" src="comparison_4x.png" alt="쿠키 기사 노비스 4배 비교"><p><a href="comparison_1x.png">원본 1× 비교</a> · <a href="contact_sheet.png">전체 21장 시트</a> · <a href="manifest.json">manifest.json</a> · <a href="NOTES.md">제작·검수 기록</a></p><details><summary>여섯 동작 GIF 보기</summary><div class="grid" id="gifs"></div></details></main>
<script>
const A={idle:[420,300,120],walk:[90,90,90,90,90,90],attack:[100,120,60,100,80,60],hurt:[90,150],dead:[100,140,1000],sit:[1000]},L={idle:'대기',walk:'걷기',attack:'공격',hurt:'피격',dead:'쓰러짐',sit:'앉기'};let action='idle',index=0,playing=true,timer;const $=id=>document.getElementById(id);
function show(){ $('sprite').src=`composite/${action}_${index}.png`;$('title').textContent=L[action];$('frame').textContent=`${action}_${index} · ${index+1}/${A[action].length}장`;$('time').textContent=`이 장 ${A[action][index]}ms`+(action==='attack'&&index===2?' · 타격':'');$('scrub').max=A[action].length-1;$('scrub').value=index;document.querySelectorAll('[data-action]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.action===action));clearTimeout(timer);if(playing)timer=setTimeout(()=>{index=(index+1)%A[action].length;show()},A[action][index]/+$('speed').value)}
for(const a of Object.keys(A)){const b=document.createElement('button');b.textContent=L[a];b.dataset.action=a;b.onclick=()=>{action=a;index=0;show()};$('actions').append(b);const card=document.createElement('div');card.className='card';card.innerHTML=`<strong>${L[a]}</strong><img src="${a}_4x.gif" alt="${L[a]}"><a href="${a}_1x.gif">1× GIF</a> · <a href="${a}_4x.gif">4× GIF</a>`;$('gifs').append(card);A[a].forEach((_,i)=>{const im=new Image();im.src=`composite/${a}_${i}.png`})}
function pause(){playing=false;$('play').textContent='재생'}$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'일시정지':'재생';show()};$('next').onclick=()=>{pause();index=(index+1)%A[action].length;show()};$('scrub').oninput=()=>{pause();index=+$('scrub').value;show()};$('speed').onchange=show;show();
</script></html>
