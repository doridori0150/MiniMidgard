<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>도둑 · 픽셀 동작 검수</title><style>body{margin:0;background:#17212c;color:#efe9dc;font:15px system-ui}main{max-width:1120px;margin:32px auto;padding:0 24px}h1{font-size:24px}p{color:#bcc7d4}button,select,input{accent-color:#cd9e66}button,select{background:#2b3b4c;border:1px solid #526477;color:inherit;padding:8px 14px;margin:4px;border-radius:6px}.stage{display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap;background:#25313e;padding:16px;border-radius:8px}canvas,img{image-rendering:pixelated}canvas{max-width:100%;height:auto}label{display:inline-block;margin:8px}input[type=range]{width:min(500px,90%)}.comparison{width:100%;height:auto}.meta{font-family:monospace;color:#e8bf8c}</style><main><h1>도둑 · thief_male_p2</h1><p>48px 대기 키 · 2등신 · 단검 · 오른쪽 3/4 · 128×120 / 발 기준 (64,112)</p><div id="actions"></div><div class="stage"><canvas id="large" width="512" height="480"></canvas><canvas id="native" width="128" height="120"></canvas></div><div><button id="play">일시정지</button><button id="prev">이전 장</button><button id="next">다음 장</button><label><input id="loop" type="checkbox" checked>검토용 반복</label><label>속도 <select id="speed"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option></select></label></div><input id="timeline" type="range" min="0" step="1"><span class="meta" id="info"></span><div id="layers"></div><h2>동일 크기 비교</h2><p>왼쪽부터 쿠키 r12 · 기사 r15 · 도둑. 모두 같은 캔버스와 발 기준점, 동일 배율.</p><img class="comparison" src="side_by_side_4x.png"><p><a href="contact_sheet.png">전체 접촉 시트</a> · <a href="NOTES.md">제작·검수 기록</a> · <a href="verification/validation.json">검증 결과</a></p></main><script>
(async()=>{const m=await fetch('manifest.json').then(r=>r.json()),id='thief_male_p2',c=m.characters[id],a=c.animations,ims=new Map(),names={idle:'대기',walk:'걷기',attack:'공격',hurt:'피격',dead:'쓰러짐',sit:'앉기'};let action='idle',index=0,playing=true,elapsed=0,last=performance.now();const $=x=>document.getElementById(x);const order=['back','body','weapon','grip','front'],labels={back:'뒷머리',body:'몸·얼굴',weapon:'단검·잔상',grip:'손 덮개',front:'앞머리'};let enabled=new Set(order);const files=n=>{const f=c.frames[n],h=m.hair[c.defaultHair].poses[n];return{back:h.back,body:f.image,weapon:m.weapons.dagger.frames[id][n],grip:f.grip,front:h.front}};await Promise.all([...new Set(Object.keys(c.frames).flatMap(n=>Object.values(files(n))))].map(async p=>{const im=new Image;im.src=p;await im.decode();ims.set(p,im)}));for(const [key,label]of Object.entries(names)){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{action=key;index=0;elapsed=0;render()};$('actions').append(b)}for(const k of order){const l=document.createElement('label'),cb=document.createElement('input');cb.type='checkbox';cb.checked=true;cb.onchange=()=>{cb.checked?enabled.add(k):enabled.delete(k);render()};l.append(cb,labels[k]);$('layers').append(l)}function render(){const an=a[action],n=an.frames[index],fs=files(n);for(const [cn,s]of [['large',4],['native',1]]){const cv=$(cn),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.fillStyle='#25313e';ctx.fillRect(0,0,cv.width,cv.height);for(const k of order)if(enabled.has(k))ctx.drawImage(ims.get(fs[k]),0,0,128*s,120*s)}$('timeline').max=an.frames.length-1;$('timeline').value=index;$('info').textContent=` ${n} · ${an.durations[index]}ms${an.hitFrame===index?' · 타격':''}`;$('play').textContent=playing?'일시정지':'재생'}function step(d){playing=false;index=(index+d+a[action].frames.length)%a[action].frames.length;elapsed=0;render()}$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('play').onclick=()=>{playing=!playing;render()};$('timeline').oninput=()=>{playing=false;index=Number($('timeline').value);elapsed=0;render()};function tick(now){let dt=(now-last)*Number($('speed').value);last=now;if(playing){elapsed+=dt;const an=a[action];while(elapsed>=an.durations[index]){elapsed-=an.durations[index];if(index<an.frames.length-1)index++;else if(an.loop||$('loop').checked)index=0;else{playing=false;elapsed=0;break}}render()}requestAnimationFrame(tick)}render();requestAnimationFrame(tick)})().catch(e=>{document.getElementById('info').textContent=e.message});
</script></html>
