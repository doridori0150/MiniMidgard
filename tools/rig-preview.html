<!doctype html><html><body style="margin:0;background:#dce6c4;font:12px system-ui">
<canvas id="c"></canvas>
<script type="module">
  // Dev-only: the engine's cut-out rig (src/render/rig.ts) in every state, outfit swaps, hair colours and facing,
  // above Codex's own manifest assembly (docs/art/rig-codex/preview_assembled.png) for side-by-side checks.
  import { loadRig, drawRigHero, rigSupports } from '/src/render/rig.ts';
  await loadRig();
  const ref = new Image(); ref.src = '/docs/art/rig-codex/preview_assembled.png'; await ref.decode().catch(() => {});
  const c = document.getElementById('c'); const dpr = 2, W = 1200, H = 920;
  c.width = W * dpr; c.height = H * dpr; c.style.width = W + 'px';
  const ctx = c.getContext('2d');
  const base = { cls: 'novice', gender: 'f', hair: 1, hairColor: 3, skin: 0, dye: 0, wtype: 'dagger', refine: 0, shield: false };
  const rows = [[
    ['idle', base, 'idle', 600],
    ['walk', base, 'walk', 320],
    ['wind-up 70ms', base, 'attack', 70],
    ['contact 140ms', base, 'attack', 140],
    ['follow 200ms', base, 'attack', 200],
    ['cast', base, 'cast', 0],
    ['sit', base, 'sit', 0],
    ['hurt', base, 'hurt', 0],
  ], [
    ['dead', base, 'dead', 900],
    ['검사·검·파랑', { ...base, cls: 'swordsman', wtype: 'sword', hairColor: 5 }, 'idle', 0],
    ['기사·양손검 contact', { ...base, cls: 'knight', wtype: 'sword2h', hairColor: 0 }, 'attack', 140],
    ['풀잎+머리핀', { ...base, headTop: 'leaf', headMid: 'hairpin', hairColor: 1 }, 'idle', 0],
    ['빨강·맨손', { ...base, wtype: 'none', hairColor: 4 }, 'walk', 160],
    ['왼쪽 보기', { ...base, hairColor: 8 }, 'idle', 0],
    ['검정', { ...base, hairColor: 9 }, 'idle', 0],
    ['창(미지원)', { ...base, cls: 'knight', wtype: 'spear' }, 'idle', 0],
  ]];
  const S = 2.2;
  rows.forEach((row, r) => row.forEach(([label, L, state, t], i) => {
    const x = 75 + i * 145, y = 200 + r * 240;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = '#333'; ctx.fillText(label, x - 40, y + 22);
    if (!rigSupports(L)) { ctx.fillText('(코드 캐릭터로 대체)', x - 40, y - 60); return; }
    ctx.setTransform(dpr * S, 0, 0, dpr * S, x * dpr, y * dpr);
    drawRigHero(ctx, L, { state, t, dur: 280, facing: label === '왼쪽 보기' ? -1 : 1 });
  }));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (ref.width) { const w = W - 20, h = ref.height * w / ref.width; ctx.drawImage(ref, 10, H - h - 4, w, h); }
  document.title = 'done';
</script></body></html>
