<!doctype html><html><body style="margin:0;background:#cfe3b8;font:12px system-ui">
<canvas id="c"></canvas>
<script type="module">
  // Dev-only: painted rig vs the painter's assembled reference, in several poses/outfits/hair colours.
  import { loadRig, drawRigHero } from '/src/render/rig.ts';
  await loadRig();
  const ref = new Image(); ref.src = '/src/assets/rig/novice/ref.png'; await ref.decode();
  const c = document.getElementById('c'); const dpr = 2, W = 1000, H = 560;
  c.width = W * dpr; c.height = H * dpr; c.style.width = W + 'px';
  const ctx = c.getContext('2d');
  const base = { cls: 'novice', gender: 'f', hair: 1, hairColor: 3, skin: 0, dye: 0, wtype: 'dagger', refine: 0, shield: false };
  const cells = [
    ['참고(Codex)', null],
    ['idle', { ...base }, 'idle', 400],
    ['walk', { ...base }, 'walk', 150],
    ['attack 140ms', { ...base }, 'attack', 140],
    ['검사·검', { ...base, cls: 'swordsman', wtype: 'sword', hairColor: 5 }, 'ready', 300],
    ['풀잎', { ...base, headTop: 'leaf', hairColor: 1 }, 'idle', 400],
    ['머리핀+베레', { ...base, headTop: 'cap', headMid: 'hairpin', hairColor: 4 }, 'idle', 400],
  ];
  const S = 0.6;
  cells.forEach(([label, L, state, t], i) => {
    const x = 70 + i * 140, y = 470;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = '#333'; ctx.fillText(label, x - 30, 530);
    if (!L) { const h = 640 * S * 76 / 640 * 5.2; ctx.drawImage(ref, x - ref.width * h / ref.height / 2, y - h, ref.width * h / ref.height, h); return; }
    ctx.setTransform(dpr * S * 5.2, 0, 0, dpr * S * 5.2, x * dpr, y * dpr);
    drawRigHero(ctx, L, { state, t, dur: 280, facing: 1 });
  });
</script></body></html>
