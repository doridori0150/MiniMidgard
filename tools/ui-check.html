<!doctype html><html><head><meta charset="utf-8"><title>ui-check</title></head>
<body style="margin:0;background:#222;color:#ddd;font:12px monospace">
<!-- Dev tool: scripted UI checks for the page shell (navigation, back order, detail stack, badges, single execution).
     Drives the real app in a 390×844 iframe booted with ?qa (QA boots never save). Prints PASS/FAIL lines into #out.
     Headless: chrome --headless=new --dump-dom http://localhost:4200/tools/ui-check.html -->
<pre id="out">running</pre>
<iframe id="f" style="width:390px;height:844px;border:0"></iframe>
<script type="module">
  const out = [];
  const log = (ok, name, info = '') => { out.push(`${ok ? 'PASS' : 'FAIL'}  ${name}${info ? '  — ' + info : ''}`); document.getElementById('out').textContent = out.join('\n') + '\n…'; };
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const f = document.getElementById('f');
  const boot = (q) => new Promise((res) => { f.onload = () => setTimeout(res, 1200); f.src = '/?qa&' + q; });
  const W = () => f.contentWindow, D = () => f.contentDocument, G = () => W().__game;
  const $ = (sel) => D().querySelector(sel), $$ = (sel) => [...D().querySelectorAll(sel)];
  const click = async (el) => { el?.click(); await sleep(60); };
  const nav = (label) => $$('.nav button').find((b) => b.textContent.includes(label));
  const esc = async () => { W().dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' })); await sleep(60); };
  const savedBefore = localStorage.getItem('minimidgard.save.v1');

  try {
    await boot('party=swordsman,acolyte,mage&lv=30');
    const g = G();
    // 1. bottom tabs open their sheet, tapping the open one closes it (the original behaviour)
    for (const [label, panel] of [['캐릭터', 'grow'], ['장비', 'equip'], ['카드', 'cards'], ['가방', 'bag'], ['지도', 'map'], ['마을', 'town']]) {
      await click(nav(label)); const a = panel === 'grow' ? g.page : g.panel; await click(nav(label));
      log(a === panel && g.panel === null, `tab ${label} opens and closes`, `${a} → ${g.panel}`);
    }
    // 캐릭터 holds both growth views behind one switch
    await click(nav('캐릭터'));
    await click($$('.grow-tabs button').find((b) => b.textContent.startsWith('스킬'))); const p1 = g.panel;
    await click($$('.grow-tabs button').find((b) => b.textContent.startsWith('스탯'))); const p2 = g.panel;
    log(p1 === 'skills' && p2 === 'status', '캐릭터: 스탯 / 스킬 switch', `${p1} → ${p2}`);
    await click(nav('캐릭터'));
    // 2. a portrait opens that companion's popup; its links open the sheet for that hero
    await click($$('.pf')[1]);
    log(g.modal?.kind === 'hero' && g.hero.name === '마루', 'portrait opens the companion popup', `${g.modal?.kind}/${g.hero.name}`);
    await click($$('.hm-links .btn').find((b) => b.textContent.startsWith('스탯')));
    log(g.modals.length === 0 && g.panel === 'status' && g.hero.name === '마루', 'popup → 스탯 sheet for that hero', `${g.panel}/${g.hero.name}`);
    g.openPanel(null); await sleep(60);
    // 3. tactics and order from the popup; selection follows the hero
    await click($$('.pf')[2]);
    const roleBtn = $$('.modal-layer:not([hidden]) .tseg button').find((b) => b.textContent === '후열');
    await click(roleBtn); log(g.s.heroes[2].tactics.position === 'back', 'popup edits tactics', g.s.heroes[2].tactics.position);
    await click($$('.modal-layer:not([hidden]) .btn').find((b) => b.textContent.includes('앞으로')));
    log(g.s.heroes[1].name === '보리' && g.hero.name === '보리', 'popup reorders, selection follows', g.s.heroes.map((h) => h.name).join(','));
    await esc(); log(g.modals.length === 0, 'Escape closes the popup');
    // 4. shop: a row's 구매 only opens the buy popup (compare); 사서 바로 장착 there buys and equips on the selected hero
    g.sel = 0; g.openTown('weapon'); await sleep(150);
    const row = $$('.srow').find((r) => !r.classList.contains('cant')); const before = g.s.heroes[0].equip.weapon, zb = g.s.zeny, nb = g.s.equips.length;
    await click(row?.querySelector('.sr-btns .btn'));
    const opened = g.modal?.kind === 'buy', nothingBought = g.s.zeny === zb && g.s.equips.length === nb;
    const cmp = !!$('.modal-layer:not([hidden]) .cmp'), btns = $$('.modal-layer:not([hidden]) .foot .btn').map((b) => b.textContent).join('/');
    log(opened && nothingBought && btns === '닫기/사서 바로 장착/구매', 'shop row 구매 opens the popup, buys nothing', `${g.modal?.kind}, ${btns}, compare ${cmp}`);
    await click($$('.modal-layer:not([hidden]) .btn').find((b) => b.textContent === '사서 바로 장착'));
    log(g.modals.length === 0 && g.s.heroes[0].equip.weapon !== before && g.s.zeny < zb, 'popup 사서 바로 장착 buys and equips', row?.querySelector('b')?.textContent ?? 'no row');
    await esc(); await esc();
    // 5. detail stack: item → sell confirm → cancel returns to the item, hero choice kept; OK runs once
    await click(nav('가방'));
    const unequipped = g.s.equips.find((e) => !g.s.heroes.some((h) => Object.values(h.equip).includes(e.uid)));
    if (unequipped) {
      g.setModal({ kind: 'item', uid: unequipped.uid }); await sleep(80);
      await click($$('.modal-layer:not([hidden]) .hero-sel button')[2]);
      await click($$('.modal-layer:not([hidden]) .btn').find((b) => b.textContent === '판매'));
      const depth = g.modals.length, inert = $('.app-main').inert;
      await click($$('.modal-layer:not([hidden]) .btn').find((b) => b.textContent === '취소'));
      const heroKept = $$('.modal-layer:not([hidden]) .hero-sel button')[2]?.classList.contains('on');
      log(depth === 2 && g.modals.length === 1 && heroKept, 'confirm cancel returns to the item, hero choice kept', `depth ${depth}, kept ${heroKept}`);
      log(inert === true, 'background is inert under a detail');
      const z0 = g.s.zeny, n0 = g.s.equips.length;
      await click($$('.modal-layer:not([hidden]) .btn').find((b) => b.textContent === '판매'));
      await click($$('.modal-layer:not([hidden]) .btn').find((b) => b.textContent === '확인'));
      log(g.modals.length === 0 && g.s.equips.length === n0 - 1 && g.s.zeny > z0, 'sell runs once and closes', `${n0}→${g.s.equips.length}`);
    } else log(false, 'detail stack checks', 'no unequipped item');
    // 6. browser Back: a detail, then a sheet
    g.openPanel(null); g.setModal(null); await sleep(150);
    await click(nav('장비')); g.setModal({ kind: 'item', id: 'u_red' }); await sleep(80);
    W().history.back(); await sleep(250); const one = `${g.modals.length}/${g.panel}`;
    W().history.back(); await sleep(250);
    log(one === '0/equip' && g.panel === null, 'browser Back: detail first, then the sheet', `${one} → ${g.modals.length}/${g.panel}`);
    // 7. skill states and prerequisites
    const sw = g.s.heroes.find((x) => x.cls === 'swordsman'); g.sel = g.s.heroes.indexOf(sw); sw.skillPts = 5; sw.skills.bash = 0; sw.skills.magnum_break = 0;
    g.openPanel('skills'); await sleep(120);
    const rows = () => Object.fromEntries($$('.skill').map((r) => [r.querySelector('.nm b')?.textContent, r.querySelector('.sk-state')?.textContent ?? (r.querySelector('.sk-learn') ? '+1' : '-')]));
    let r1 = rows();
    log(r1['강타'] === '+1' && r1['폭렬검'] === '선행 필요', 'skill rows: learnable / prerequisite', JSON.stringify(r1));
    sw.skillPts = 0; g.notify(); await sleep(120); r1 = rows();
    log(r1['강타'] === '포인트 부족', 'no points → 포인트 부족', r1['강타']);
    // 8. recruit from the rail
    g.openPanel(null); await sleep(80);
    const qaParty = g.s.heroes.length;
    log(g.s.partySlots === 3 && qaParty === 3, 'party full (no recruit button needed)', `${qaParty}/${g.s.partySlots}`);
    // 9. quick slot: a key press or a tap switches that slot's auto use (once each); items are never used by hand
    const qs = $('.qs'), id = g.s.quick[0].id, n0 = g.s.stacks[id], a0 = g.s.quick[0].auto;
    for (const u of g.world.heroes) u.hp = u.d.maxHp; // nobody needs a potion during the check
    qs.dispatchEvent(new MouseEvent('click', { bubbles: true, detail: 0 })); await sleep(60);
    const a1 = g.s.quick[0].auto;
    qs.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true })); qs.dispatchEvent(new PointerEvent('pointerup', { bubbles: true }));
    qs.dispatchEvent(new MouseEvent('click', { bubbles: true, detail: 1 })); await sleep(60);
    log(a1 === !a0 && g.s.quick[0].auto === a0 && g.s.stacks[id] === n0, 'quick slot: key / tap toggle auto once each, nothing used', `${a0}→${a1}→${g.s.quick[0].auto}, ${n0}→${g.s.stacks[id]}`);
    // 9b. 목표 핀: pin from an item detail, the strip shows it, owning one more clears it
    g.setModal({ kind: 'item', id: 'w_bloodmoon' }); await sleep(80);
    await click($('.modal-layer:not([hidden]) .pin-btn')); g.setModal(null); await sleep(80);
    const pinned = (g.s.targets ?? []).some((t) => t.id === 'w_bloodmoon') && !!$('.tstrip');
    g.s.equips.push({ uid: 987654, id: 'w_bloodmoon', refine: 0, slots: 0, cards: [] }); await sleep(1300);
    log(pinned && !(g.s.targets ?? []).some((t) => t.id === 'w_bloodmoon'), '목표 핀: pin → strip → obtained clears it', `pinned ${pinned}`);
    // 12. 스킬 슬롯: six slots; a slot opens the picker, a pick fills it, 비우기 clears it; a row's slot button puts it in / takes it out
    g.openPanel(null); g.setModal(null); await sleep(80);
    const sw2 = g.s.heroes.find((x) => x.cls === 'swordsman'); g.sel = g.s.heroes.indexOf(sw2);
    sw2.skills.bash = 5; sw2.skillSlots = [null, null, null, null, null, null];
    g.openPanel('skills'); await sleep(150);
    const slotEls = $$('.sk-slots .sk-slot');
    await click(slotEls[2]);
    await click($$('.sk-pick-item').find((b) => b.textContent.includes('강타')));
    const assigned = sw2.skillSlots[2] === 'bash' && !!$$('.sk-slots .sk-slot')[2]?.querySelector('img');
    await click($$('.sk-slots .sk-slot')[2]);
    await click($$('.sk-pick .btn').find((b) => b.textContent === '비우기'));
    const cleared = sw2.skillSlots[2] === null;
    const rowBtn = () => $$('.skill').find((r) => r.querySelector('.nm b')?.textContent === '강타')?.querySelector('.sk-slotbtn');
    await click(rowBtn()); const inRow = sw2.skillSlots.includes('bash');
    await click(rowBtn()); const outRow = !sw2.skillSlots.includes('bash');
    const passiveBtn = $$('.skill').find((r) => r.querySelector('.nm b')?.textContent === '한손검 수련')?.querySelector('.sk-slotbtn');
    log(slotEls.length === 6 && assigned && cleared && inRow && outRow && !passiveBtn, '스킬 슬롯: 6 slots, pick / 비우기 / row 슬롯 넣기·빼기 (passives have none)',
      `${slotEls.length} ${assigned} ${cleared} ${inRow} ${outRow} passive:${!!passiveBtn}`);
    // 13. the AI uses only slotted skills: an unslotted bash is never cast; slotted, it is
    g.openPanel(null); await sleep(60);
    const wu = g.world.heroes.find((u) => u.hero === sw2);
    sw2.tactics = { ...sw2.tactics, skills: 'aggressive' };
    const casts = [];
    const orig = g.world.startSkill.bind(g.world);
    g.world.startSkill = (hh, sk, lv, tt) => { if (hh === wu) casts.push(sk.id); return orig(hh, sk, lv, tt); };
    for (const u of g.world.heroes) { u.hp = u.d.maxHp; u.sp = u.d.maxSp; }
    for (let i = 0; i < 300; i++) g.world.advance(100);
    const bashOff = casts.filter((x) => x === 'bash').length;
    sw2.skillSlots = ['bash', null, null, null, null, null];
    for (const u of g.world.heroes) { u.hp = u.d.maxHp; u.sp = u.d.maxSp; }
    for (let i = 0; i < 300; i++) g.world.advance(100);
    const bashOn = casts.filter((x) => x === 'bash').length - bashOff;
    g.world.startSkill = orig;
    log(bashOff === 0 && bashOn > 0, 'AI: an unslotted skill is never cast, a slotted one is', `bash unslotted ${bashOff}, slotted ${bashOn}`);
    // 10. recruit flow with a free slot
    await boot('party=swordsman&lv=24');
    const g2 = G(); await click($('.pf-add'));
    const inp = $('.modal-layer:not([hidden]) input');
    if (inp) { inp.value = '새친구'; inp.dispatchEvent(new (W().Event)('input', { bubbles: true })); await sleep(80); }
    await click([...$$('.modal-layer:not([hidden]) .btn.pri')].pop());
    log(g2.s.heroes.length === 2 && g2.s.heroes[1].name === '새친구', 'recruit adds a companion', g2.s.heroes.map((h) => h.name).join(','));
    // 11. 균열: the town view shows the run's rules, 균열 입장 starts it (HUD + gauge), the gauge reopens the view, 나가기 → town
    await boot('party=knight,priest,wizard&lv=62&rift=3');
    const g3 = G();
    g3.openTown('rift'); await sleep(150);
    const rules = $$('.rf-rule').length;
    await click($('.rf-go')); await sleep(200);
    const inRift = !!g3.world.rift && ($('.tb-zone')?.textContent ?? '').includes('균열') && !!$('.gauge.rift');
    log(rules >= 2 && inRift && g3.panel === null, '균열: entry screen → run, HUD and gauge show it', `rules ${rules}, rift ${!!g3.world.rift}, panel ${g3.panel}`);
    await click($('.gauge.rift button')); await sleep(120);
    await click($$('.rf-live .btn').find((b) => b.textContent === '나가기'));
    await click($$('.modal-layer:not([hidden]) .btn').find((b) => b.textContent === '확인')); await sleep(120);
    log(!g3.world.rift && g3.s.zone === 'town' && g3.s.rift?.last?.why === '포기', '균열: 나가기 gives the run up and returns to town', `${g3.s.zone}, ${g3.s.rift?.last?.why}`);
    // 14. build signature skills (SKILLS_META.md): tagged rows in the skill list (gold for the hero's own build), the
    //     build card leads with them, and a slotted signature active is cast in the field
    await boot('party=knight,priest,wizard&lv=62&builds=kn_crit,pr_support,wz_storm&zone=cave');
    const g5 = G(); g5.sel = 0;
    g5.openPanel('skills'); await sleep(150);
    const tagOf = (name) => $$('.skill').find((r) => r.querySelector('.nm b')?.textContent === name)?.querySelector('.chip.build');
    const moonTag = tagOf('광월참'), artTag = tagOf('광월의 극의'), galeTag = tagOf('질풍 보법');
    log(moonTag?.textContent === '빌드: 광월 크리 기사' && moonTag.classList.contains('mine') && artTag?.classList.contains('mine') && !!galeTag && !galeTag.classList.contains('mine'),
      'signature skills: build tags in the skill list (own build gold)', `${moonTag?.textContent} / ${galeTag?.textContent}`);
    g5.openPanel(null); g5.pushModal({ kind: 'build', heroId: g5.s.heroes[0].id }); await sleep(150);
    const card = $$('.bd-card').find((c) => c.querySelector('.bd-head b')?.textContent === '광월 크리 기사');
    const firstSig = card?.querySelector('.bd-line .bd-sig')?.textContent ?? '';
    const lineText = card?.querySelector('.bd-line')?.textContent ?? '';
    log(firstSig.includes('광월참') && lineText.replace('핵심 스킬', '').trim().startsWith('★ 광월참'), 'build card lists the signature skill first', lineText);
    g5.popModal(); await sleep(80);
    const kn = g5.s.heroes[0];
    g5.s.equips.push({ uid: 987001, id: 'w_claymore', refine: 0, slots: 0, cards: [] }); kn.equip.weapon = 987001; g5.world.syncParty();
    const moonCasts = [];
    const orig5 = g5.world.startSkill.bind(g5.world);
    g5.world.startSkill = (hh, sk, lv, tt) => { if (hh.hero === kn) moonCasts.push(sk.id); return orig5(hh, sk, lv, tt); };
    for (const u of g5.world.heroes) { u.hp = u.d.maxHp; u.sp = u.d.maxSp; }
    for (let i = 0; i < 600 && !moonCasts.includes('moon_slash'); i++) g5.world.advance(100);
    g5.world.startSkill = orig5;
    log((kn.skillSlots ?? []).includes('moon_slash') && moonCasts.includes('moon_slash'), 'AI: a slotted signature active (광월참) is cast', `slots ${(kn.skillSlots ?? []).join(',')}; casts ${[...new Set(moonCasts)].join(',')}`);
  } catch (e) { log(false, 'exception', e.message); }
  log(localStorage.getItem('minimidgard.save.v1') === savedBefore, 'QA run never touched the save');
  const fails = out.filter((l) => l.startsWith('FAIL')).length;
  document.getElementById('out').textContent = out.join('\n') + `\n\n${out.length - fails}/${out.length} passed`;
  document.title = 'done';
</script></body></html>
