<!doctype html><html><head><meta charset="utf-8"><title>contact</title></head>
<body style="margin:0;background:#222;font:12px system-ui;color:#ddd">
<!-- Dev tool: tiles screenshots for review. /tools/contact.html?dir=/docs/ux/phaseA&files=a-hunt,a-party&cols=5&w=300 -->
<div id="g" style="display:grid;gap:6px;padding:6px"></div>
<script>
  const q = new URLSearchParams(location.search);
  const cols = Number(q.get('cols') ?? 5), w = Number(q.get('w') ?? 300);
  const g = document.getElementById('g'); g.style.gridTemplateColumns = `repeat(${cols}, ${w}px)`;
  for (const f of (q.get('files') ?? '').split(',')) {
    const d = document.createElement('div');
    d.innerHTML = `<div>${f}</div><img src="${q.get('dir')}/${f}.png" style="width:${w}px;display:block">`;
    g.appendChild(d);
  }
</script></body></html>
