<!doctype html><html><head><meta charset="utf-8"><title>frames</title></head>
<body style="margin:0;background:#222;font:12px system-ui;color:#ddd">
<!-- Dev tool: the app at several phone sizes side by side (QA boots never save).
     /tools/frames.html?q=qa%26page=grow&sizes=390x844,360x800 -->
<div id="g" style="display:flex;gap:10px;padding:8px;align-items:flex-start"></div>
<script>
  const p = new URLSearchParams(location.search);
  const q = decodeURIComponent(p.get('q') ?? 'qa');
  for (const s of (p.get('sizes') ?? '390x844,360x800').split(',')) {
    const [w, h] = s.split('x').map(Number);
    const d = document.createElement('div');
    d.innerHTML = `<div>${s}</div><iframe src="/?${q}" style="width:${w}px;height:${h}px;border:0;background:#000"></iframe>`;
    document.getElementById('g').appendChild(d);
  }
</script></body></html>
