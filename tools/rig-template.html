<!doctype html><html><body style="margin:0;background:#fff">
<canvas id="c" width="1024" height="1024" style="width:1024px;height:1024px;display:block"></canvas>
<script>
  // Dev-only: the rig template the painter draws over. Joint coordinates here are the contract used by src/render/rig.ts.
  const J = {
    ground: 968,
    head: { cx: 520, cy: 255, rx: 210, ry: 195 },     // head incl. hair volume
    neck: [512, 448],
    shoulderF: [600, 478], shoulderB: [418, 482],     // front = viewer's right (character faces right, 3/4)
    handF: [668, 700], handB: [352, 700],             // arms hang ~20° away from the body, empty fists
    hipF: [560, 660], hipB: [462, 660],
    footF: [600, 960], footB: [430, 960],
  };
  const c = document.getElementById('c'), x = c.getContext('2d');
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, 1024, 1024);
  // faint grid
  x.strokeStyle = '#eef0f4'; x.lineWidth = 1;
  for (let i = 0; i <= 1024; i += 64) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, 1024); x.moveTo(0, i); x.lineTo(1024, i); x.stroke(); }
  // silhouette guide
  x.fillStyle = 'rgba(150,160,180,0.28)';
  x.beginPath(); x.ellipse(J.head.cx, J.head.cy, J.head.rx, J.head.ry, 0, 0, Math.PI * 2); x.fill();
  x.beginPath(); x.moveTo(430, 470); x.lineTo(604, 470); x.lineTo(626, 700); x.lineTo(400, 700); x.closePath(); x.fill(); // torso + skirt
  const limb = (a, b, w) => { x.lineCap = 'round'; x.lineWidth = w; x.strokeStyle = 'rgba(150,160,180,0.28)'; x.beginPath(); x.moveTo(...a); x.lineTo(...b); x.stroke(); };
  limb(J.shoulderF, J.handF, 62); limb(J.shoulderB, J.handB, 58);
  limb(J.hipF, J.footF, 74); limb(J.hipB, J.footB, 70);
  // ground line
  x.strokeStyle = '#3a8a3a'; x.lineWidth = 3; x.beginPath(); x.moveTo(250, J.ground); x.lineTo(780, J.ground); x.stroke();
  // joints
  const dot = (p, col, label) => { x.fillStyle = col; x.beginPath(); x.arc(p[0], p[1], 9, 0, Math.PI * 2); x.fill(); x.fillStyle = '#222'; x.font = '16px sans-serif'; x.fillText(label, p[0] + 13, p[1] + 5); };
  dot(J.neck, '#e03030', 'neck');
  dot(J.shoulderF, '#2a6ae0', 'shoulder F'); dot(J.shoulderB, '#2a6ae0', 'shoulder B');
  dot(J.handF, '#e0a020', 'fist F'); dot(J.handB, '#e0a020', 'fist B');
  dot(J.hipF, '#2a9a3a', 'hip F'); dot(J.hipB, '#2a9a3a', 'hip B');
  dot(J.footF, '#7a4a2a', 'foot F'); dot(J.footB, '#7a4a2a', 'foot B');
  x.fillStyle = '#222'; x.font = '18px sans-serif';
  x.fillText('RIG TEMPLATE - 3/4 view facing right, 3 heads tall, feet on the green line', 160, 1010);
  window.J = J;
</script></body></html>
